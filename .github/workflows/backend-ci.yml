name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  code-quality-and-tests:
    name: Code Quality, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/noxia_test?schema=public'
      JWT_ACCESS_SECRET: github-actions-test-secret-value-32chars
      JWT_ACCESS_TTL: '15m'
      AWS_REGION: us-east-1
      AWS_S3_BUCKET_NAME: noxia-storage-test
      AWS_ACCESS_KEY_ID: dummy-access-key
      AWS_SECRET_ACCESS_KEY: dummy-secret-key
      MAIL_API_KEY: re_test_mock_key
      MAIL_FROM_ADDRESS: test@noxia.com
      MAIL_FROM_NAME: Noxia Test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (Mandatory for Types & Tests)
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Strict TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Linting Verification
        run: npm run lint

      - name: Execute Unit Test Suite (Jest)
        run: npm test

  db-integrity-and-drift:
    name: Database Integrity & Drift Verification
    runs-on: ubuntu-latest
    needs: [code-quality-and-tests]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Database Migrations & Drift vs Supabase
        run: |
          set +e
          STATUS_OUTPUT=$(npx prisma migrate status 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$STATUS_OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Database schema is 100% up to date with Supabase."
            exit 0
          fi

          # Fail immediately if true database drift is detected
          if echo "$STATUS_OUTPUT" | grep -qi "drift"; then
            echo "❌ Error: Database schema drift detected against Supabase!"
            exit 1
          fi

          # If the only discrepancy is unapplied migrations waiting to be deployed:
          if echo "$STATUS_OUTPUT" | grep -qi "have not yet been applied"; then
            echo "ℹ️ Pending migrations detected. These will be deployed automatically upon merge to main."
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "✅ PR validation passed: pending migrations will be applied when merged."
              exit 0
            fi
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "ℹ️ Push to non-main branch (${{ github.ref }}): pending migrations will deploy upon merge to main."
              exit 0
            fi
            echo "Push to main: proceeding to deploy job to apply pending migrations..."
            exit 0
          fi

          # For any other failure (e.g. network timeout, auth failure), exit with original code
          exit $EXIT_CODE

  deploy-to-render:
    name: Apply Migrations & Deploy to Render
    runs-on: ubuntu-latest
    needs: [db-integrity-and-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Pending Migrations to Supabase Production
        run: npx prisma migrate deploy

      - name: Verify Post-Deployment Database Integrity
        run: npx prisma migrate status

      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering Render Deployment Hook..."
          response=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$response" -ne 200 ] && [ "$response" -ne 201 ]; then
            echo "Render Deploy Hook failed with HTTP status $response"
            cat response.txt
            exit 1
          fi
          echo "Render deployment successfully triggered (HTTP $response)."
